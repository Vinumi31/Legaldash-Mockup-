<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LegalDash — Off-Limits &amp; Non-Solicit Register</title>
<style>
  :root{
    --navy:#0e1c3d; --navy2:#16264f; --ink:#1f2a44; --slate:#475569; --slate2:#64748b;
    --muted:#94a3b8; --line:#e6ebf3; --bg:#f3f6fb; --card:#ffffff; --blue:#2563eb;
    --blueDk:#1d4ed8; --blueSoft:#e8eefc; --green:#22c55e; --greenDk:#16a34a;
    --amber:#b45309; --amberSoft:#fdf3e3; --headerBg:#f6f8fc;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer;}
  .ico{display:inline-block; vertical-align:middle; flex:none;}
  .tabular{font-variant-numeric:tabular-nums;}
  .clamp2{display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}

  /* Top bar */
  .topbar{position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border-bottom:1px solid var(--line); padding:12px 20px;}
  .tb-left{display:flex; align-items:center; gap:16px;}
.sh-logo-img{height:32px; width:auto; display:block; object-fit:contain;}
  .sh-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:2px;}
  .sh-grid span{height:6px; width:6px; border-radius:2px;}
  .sh-name{line-height:1;}
  .sh-name .a{font-size:14px; font-weight:800; letter-spacing:-.02em; color:var(--navy);}
  .sh-name .b{font-size:12px; font-weight:600; letter-spacing:.04em; color:var(--blue);}
  .crumb{display:flex; align-items:center; gap:6px; padding-left:12px; font-size:14px; color:var(--slate2);}
  .crumb .home{color:var(--blue); font-weight:600; background:none; border:none; padding:0;}
  .crumb .home:hover{text-decoration:underline;}
  .crumb .cur{color:var(--slate);}
  .tb-right{display:flex; align-items:center; gap:12px;}
  .btn-fin{display:flex; align-items:center; gap:8px; background:var(--green); color:#fff; border:none;
    border-radius:6px; padding:8px 14px; font-size:14px; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .avatar{display:grid; place-items:center; height:40px; width:40px; border-radius:9999px;
    border:1px solid var(--line); background:#fff; color:var(--slate2);}


  /* Profile panel */
  .profile-panel{position:fixed; top:58px; right:18px; width:300px; max-width:calc(100vw - 28px); background:#fff; border:1px solid #e6ebf3; border-radius:0 0 6px 6px; box-shadow:0 10px 28px rgba(16,30,54,.18); padding:24px 18px 30px; z-index:80;}
  .profile-avatar{width:86px;height:86px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:#e8eefc;color:#3d8ed6;border:5px solid #edf1f7;position:relative;}
  .profile-avatar:after{content:"";position:absolute;right:0;bottom:2px;width:11px;height:11px;border-radius:50%;background:#21c47b;border:2px solid #fff;}
  .profile-name{text-align:center;font-size:22px;font-weight:700;color:#111827;margin-bottom:20px;}
  .profile-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 20px;}
  .profile-stat{background:#f4f6fa;border:1px solid #e4e9f1;border-radius:16px;text-align:center;padding:12px 8px 10px;}
  .profile-stat-top{font-size:30px;font-weight:700;line-height:1.05;color:#1f2a44;display:flex;justify-content:center;align-items:center;gap:7px;}
  .profile-stat-label{font-size:12px;font-weight:600;color:#64748b;margin-top:7px;}
  .profile-section-title{font-size:13px;font-weight:800;letter-spacing:.06em;color:#64748b;margin:0 0 9px;}
  .profile-links{display:flex;flex-direction:column;gap:8px;}
  .profile-link{width:100%;display:grid;grid-template-columns:32px 1fr 18px;align-items:center;text-align:left;gap:8px;border:1px solid #e4e9f1;background:#f6f8fb;border-radius:14px;padding:12px 14px;color:#243452;font-size:15px;font-weight:650;}
  .profile-link:hover{background:#eef3fb;}
  .plink-icon{color:#64748b;display:grid;place-items:center;}
  .plink-arrow{font-size:24px;color:#94a3b8;text-align:right;line-height:1;}
  .profile-signout{width:100%;margin-top:18px;border:0;border-radius:11px;background:#fdebed;color:#f0444f;font-size:17px;font-weight:700;padding:13px 14px;}

  /* Layout */
  .wrap{max-width:1280px; margin:0 auto; padding:14px 18px 22px;}
  .wrap-lg{max-width:1280px; margin:0 auto; padding:16px 20px;}

  /* Landing */
  .eyebrow{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--blue);}
  h1.title{margin:4px 0 0; font-size:30px; font-weight:800; letter-spacing:-.02em; color:var(--navy);}
  .lead{margin-top:8px; max-width:640px; font-size:14px; color:var(--slate);}
  .tiles{display:grid; grid-template-columns:repeat(4, 290px); justify-content:stretch; gap:20px; margin-top:10px;}
  @media(max-width:900px){.tiles{grid-template-columns:repeat(2,220px); justify-content:center;}}
  @media(max-width:620px){.tiles{grid-template-columns:220px; justify-content:center;}}
  .tile{display:flex; flex-direction:column; align-items:flex-start; text-align:left; background:var(--card);
    border:1px solid var(--line); border-radius:16px; padding:16px; min-height:220px; box-shadow:0 1px 2px rgba(16,30,54,.05);
    transition:transform .15s ease, box-shadow .15s ease;}
  .tile:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(16,30,54,.10);}
  .tile.primary{border-color:#be123c;}
  .tile-ic{display:grid; place-items:center; height:48px; width:48px; border-radius:12px;}
  .tile-head{display:flex; width:100%; align-items:flex-start; justify-content:space-between; gap:8px; margin-top:16px;}
  .tile-head h2{margin:0; font-size:18px; font-weight:700; color:var(--ink);}
  .tile-head .arr{color:var(--muted); margin-top:2px; transition:transform .15s ease;}
  .tile:hover .tile-head .arr{transform:translate(2px,-2px);}
  .tile p{margin:6px 0 0; font-size:14px; color:var(--slate2);}
  .tile .meta{margin-top:16px; border:1px solid var(--line); color:var(--slate2); border-radius:9999px;
    padding:4px 10px; font-size:12px; font-weight:500;}

  /* Stub */
  .stub{max-width:768px; margin:0 auto; padding:64px 20px; text-align:center;}
  .stub-ic{margin:0 auto; display:grid; place-items:center; height:56px; width:56px; border-radius:16px;
    background:var(--blueSoft); color:var(--blue);}
  .stub h1{margin:20px 0 0; font-size:24px; font-weight:700; color:var(--navy);}
  .stub p{margin:8px auto 0; max-width:420px; font-size:14px; color:var(--slate);}
  .btn-back{margin-top:24px; display:inline-flex; align-items:center; gap:8px; background:var(--navy); color:#fff;
    border:none; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:600;}
  .page-back{display:flex; justify-content:flex-start; margin-bottom:16px;}
  .page-back .btn-back{margin-top:0;}

  .change-page{padding-top:0;}
  .change-title-card{background:var(--card); border:1px solid var(--line); border-radius:6px; min-height:98px; display:flex; align-items:center; padding:20px; box-shadow:0 4px 14px rgba(37,99,235,.10); margin-bottom:24px;}
  .change-table-card{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:22px; box-shadow:0 4px 14px rgba(37,99,235,.10);}
  .change-table{width:100%; border-collapse:separate; border-spacing:0; font-size:14px;}
  .change-table th{background:#f1f1f1; color:var(--ink); text-align:left; font-weight:600; padding:11px 12px; border-bottom:1px solid #dfe5ee;}
  .change-table th:first-child{width:54px;} .change-table th:last-child{width:110px;}
  .change-table th svg{float:right; opacity:.35;}
  .change-empty{height:142px; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#c0c6d0; gap:8px;}
  .empty-file{color:#d8dce2;}

  /* Register table clarity */
  .proposal-card .tscroll, .contract-card .tscroll{
    margin:0 12px 12px;
    border:1px solid #dfe5ee;
    border-radius:4px;
    overflow:auto;
    background:#fff;
  }
  .proposal-card .proposal-table, .contract-card .contract-table{
    border-collapse:separate;
    border-spacing:0;
  }
  .proposal-card .proposal-table thead th, .contract-card .contract-table thead th{
    border-top:none;
    border-bottom:1px solid #d8dee8;
  }
  .proposal-card .proposal-table tbody td, .contract-card .contract-table tbody td{
    border-bottom:1px solid #e6eaf0;
  }
  .proposal-card .proposal-table tbody tr:last-child td, .contract-card .contract-table tbody tr:last-child td{
    border-bottom:none;
  }

  /* Contract Register */
  .contract-card{background:var(--card); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 8px 22px rgba(30,64,175,.10); overflow:hidden;}
  .contract-toolbar{display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:18px 20px 22px;}
  .contract-search{position:relative; width:235px;}
  .contract-search .ico{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none;}
  .contract-search input{height:46px; width:100%; border:1px solid var(--line); border-radius:5px; padding:0 12px 0 40px;
    font-size:14px; color:var(--ink); outline:none;}
  .contract-search input:focus{border-color:var(--blue);}
  .contract-status-link{border:none; background:none; color:var(--blue); font-size:14px; font-weight:600; margin-right:2px;}
  .contract-table{min-width:1100px;}\n  .contract-table th.start-date-col, .contract-table td.start-date-col{white-space:nowrap; min-width:120px;}
  .contract-table thead th{background:#f1f1f1; padding:12px 9px; color:var(--ink);}
  .contract-table thead th .ico{float:right; color:#c2c2c2; margin-left:8px;}
  .contract-table tbody td{padding:10px 9px; vertical-align:middle; white-space:nowrap;}
  .contract-table td.client{font-weight:500;}
  .contract-table td.assign span{font-weight:500;}
  .contract-table .revenue{color:var(--blue); font-weight:600;}
  .contract-status{display:inline-flex; align-items:center; justify-content:center; min-width:146px; padding:7px 12px;
    border:1px solid; border-radius:4px; font-size:13px; font-weight:500;}
  .contract-status.approved{color:#16a34a; border-color:#22c55e; background:#fff;}
  .contract-status.revision{color:#ef4444; border-color:#ef4444; background:#fff;}
  .doc-status{display:inline-flex; align-items:center; justify-content:center; min-width:148px; padding:7px 12px;
    border:1px solid; border-radius:4px; font-size:13px; font-weight:500;}
  .doc-status.initiated{color:#ef4444; border-color:#ef4444;}
  .doc-status.bypassed{color:#3730a3; border-color:#4f63c6;}
  .contract-actions{display:flex; align-items:center; gap:10px;}
  .contract-actions button{border:none; background:none; color:var(--blue); padding:2px;}
  .contract-actions button:hover{color:var(--blueDk);}
  .contract-foot{display:flex; align-items:center; justify-content:flex-end; gap:24px; padding:10px 16px; color:var(--slate2);
    font-size:12px; border-top:1px solid var(--line);}
  @media(max-width:900px){
    .contract-toolbar{flex-wrap:wrap; justify-content:flex-end; padding:24px 16px;}
    .contract-search{width:200px;}
    .contract-card .tscroll{margin:0 12px;}
  }
  @media(max-width:620px){
    .contract-toolbar{justify-content:center;}
  }

  /* Proposal Register */
  .proposal-back{display:flex; justify-content:flex-start; margin-bottom:8px;}
  .btn-back-outline{display:inline-flex; align-items:center; gap:7px; background:#fff; color:var(--blue);
    border:1px solid #cbd5e1; border-radius:7px; padding:7px 11px; font-size:13px; font-weight:600;}
  .btn-back-outline:hover{background:#f8fafc;}
  .proposal-tabs{display:flex; justify-content:flex-end; gap:10px; margin-bottom:10px;}
  .proposal-tab{min-width:112px; height:48px; padding:0 18px; border:1px solid var(--blue); border-radius:10px;
    background:#fff; color:var(--blue); font-size:15px; font-weight:600;}
  .proposal-tab.active{background:var(--blue); color:#fff;}
  .proposal-card{background:var(--card); border:1px solid var(--line); border-radius:12px;
    box-shadow:0 8px 22px rgba(30,64,175,.10); overflow:hidden;}
  .proposal-toolbar{display:flex; align-items:center; justify-content:flex-end; gap:8px; padding:18px 20px 22px;}
  .status-link{border:none; background:none; color:var(--blue); font-size:14px; font-weight:600; margin-right:2px;}
  .proposal-search{position:relative; width:235px;}
  .proposal-search .ico{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none;}
  .proposal-search input{height:46px; width:100%; border:1px solid var(--line); border-radius:5px; padding:0 12px 0 40px;
    font-size:14px; color:var(--ink); outline:none;}
  .proposal-search input:focus{border-color:var(--blue);}
  .search-btn{height:46px; width:50px; display:grid; place-items:center; border:none; border-radius:5px;
    background:var(--blue); color:#fff;}
  .advanced-btn{height:46px; padding:0 18px; border:none; border-radius:5px; background:#9ca3af; color:#fff;
    font-size:14px; font-weight:600;}
  .proposal-table{min-width:900px;}
  .proposal-table thead th{background:#f1f1f1; padding:12px 9px; color:var(--ink);}
  .proposal-table thead th .ico{float:right; color:#c2c2c2; margin-left:8px;}
  .proposal-table tbody td{padding:10px 9px; vertical-align:middle;}
  .proposal-table td.client{font-weight:500;}
  .proposal-table td.assign span{font-weight:500;}
  .revenue{color:var(--blue); font-weight:600;}
  .status{display:inline-flex; align-items:center; justify-content:center; min-width:100px; padding:7px 12px;
    border:1px solid; border-radius:4px; font-size:13px; font-weight:500;}
  .status.progress{color:var(--blue); border-color:var(--blue); background:#fff;}
  .status.won{color:#16a34a; border-color:#22c55e; background:#fff;}
  .status.lost{color:#ef4444; border-color:#ef4444; background:#fff;}
  .stage{display:inline-flex; align-items:center; justify-content:center; min-width:152px; min-height:42px;
    padding:6px 14px; border:1px solid #3bb4d5; border-radius:4px; color:#2d9ec0; font-weight:600; text-align:center;}
  .actions{display:flex; align-items:center; gap:10px;}
  .actions button{border:none; background:none; color:var(--blue); padding:2px;}
  .actions button:hover{color:var(--blueDk);}
  .proposal-foot{display:flex; align-items:center; justify-content:flex-end; gap:24px; padding:10px 16px; color:var(--slate2);
    font-size:12px; border-top:1px solid var(--line);}
  .proposal-foot .pager{margin-left:0;}
  @media(max-width:900px){
    .proposal-toolbar{flex-wrap:wrap; justify-content:flex-end; padding:24px 16px;}
    .proposal-search{width:200px;}
  }
  @media(max-width:620px){
    .proposal-tabs{justify-content:center;}
    .proposal-tab{min-width:105px;}
    .proposal-toolbar{justify-content:center;}
  }

  /* Off-Limits Detail Panel */
  .modal-overlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.48);display:flex;align-items:flex-start;justify-content:center;padding:22px 8px;overflow:auto;}
  .detail-panel{width:min(874px,calc(100vw - 32px));min-height:545px;background:#fff;border-radius:4px;box-shadow:0 18px 50px rgba(0,0,0,.25);overflow:hidden;}
  .detail-head{display:grid;grid-template-columns:1fr 1fr auto;align-items:center;gap:28px;min-height:82px;padding:16px 26px;background:#e8f3ff;border-bottom:1px solid #d7e7f7;}
  .detail-label{font-size:13px;color:#0e1c3d;margin-bottom:5px}.detail-value{font-size:14px;font-weight:700;color:var(--blue)}
  .detail-close{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border:1px solid var(--blue);border-radius:4px;background:#fff;color:var(--blue);font-size:13px;font-weight:600}
  .detail-body{padding:48px 42px 58px}.detail-field{margin-bottom:34px}.detail-field:last-child{margin-bottom:0}
  .detail-field label{display:block;margin-bottom:12px;font-size:15px;color:#1f2a44}
  .toggle{display:inline-flex;border:1px solid #d7dce4;border-radius:2px;overflow:hidden}.toggle button{height:28px;padding:0 10px;border:0;border-right:1px solid #d7dce4;background:#fff;color:#334155;font-size:13px}.toggle button:last-child{border-right:0}.toggle button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .detail-textarea{width:100%;height:36px;resize:vertical;border:1px solid #d5d9df;border-radius:2px;padding:8px 12px;font:13px inherit;color:#334155;background:#f8f8f8}.detail-textarea:disabled{color:#aeb7c2}
  .detail-heading{margin:0 0 12px;font-size:20px;color:#0e1c3d}.dept-pills{display:flex;flex-wrap:wrap;gap:8px}.dept-pill{display:inline-flex;align-items:center;background:var(--blue);color:#fff;border-radius:2px;padding:5px 9px;font-size:12px;font-weight:600}
  .overview-heading{margin-top:28px}.detail-overview{margin:0;font-size:13px;line-height:1.5;color:#1f2a44}
  @media(max-width:650px){.detail-head{grid-template-columns:1fr;gap:12px}.detail-close{justify-self:start}.detail-body{padding:30px 24px 40px}}

  /* Compact Off-Limits page header */
  .offlimits-header{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:4px;}
  .offlimits-title-wrap{display:flex; align-items:center; gap:14px; min-width:0; flex:1;}
  .offlimits-title-wrap .reg-title{margin:0;}
  .offlimits-title-wrap .guidance{margin:0; padding:0; border:0; background:transparent;}
  .offlimits-title-wrap .guidance p{margin:0;}
  .offlimits-back{display:inline-flex; align-items:center; gap:6px; flex:none; height:32px; padding:0 10px;
    border:1px solid #cbd5e1; border-radius:6px; background:#fff; color:var(--blue); font-size:12px; font-weight:600;}
  .offlimits-back:hover{background:#f7faff;}
  .page-back-row{height:78px; padding-top:22px; display:flex; align-items:flex-start; justify-content:flex-start;}
  .offlimits-reg-card{margin-top:4px;}

  /* Register header */
  h1.reg-title{margin:0; font-size:24px; font-weight:800; letter-spacing:-.02em; color:var(--navy);}
  .guidance{margin-top:12px; display:flex; align-items:flex-start; gap:12px; background:transparent;
    border:0; border-radius:0; padding:0; color:var(--slate);}
  .guidance .ico{color:var(--slate2); margin-top:2px;}
  .guidance p{margin:0; font-size:13px; line-height:1.6;}

  /* Off-Limits Stat Card */
  .stats{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px; margin:10px 0 14px; align-items:stretch;}
  .stat{width:auto; max-width:none; min-height:92px; display:flex; align-items:center; gap:14px;
    background:var(--card); border:1px solid var(--line); border-radius:9px; padding:14px 18px;
    box-shadow:0 5px 14px rgba(30,64,175,.08);}
  .stat-ic{display:grid; place-items:center; width:44px; height:44px; flex:none;
    border:3px solid #f0a500; border-radius:50%; color:#f0a500; background:#fff;}
  .stat-percent{display:grid; place-items:center; width:58px; height:58px; flex:none;
    border:3px solid var(--blue); border-radius:50%; color:var(--blue); background:#fff;
    font-size:16px; font-weight:800;}
  .stat-copy{min-width:0; flex:1;}
  .stat .lbl{display:flex; align-items:center; gap:7px; margin:0; font-size:14px; font-weight:500; color:var(--ink);}
  .stat .num{display:block; margin-top:4px; font-size:24px; font-weight:800; letter-spacing:-.02em; color:var(--navy);}
  .stat-note{margin:5px 0 0; font-size:12px; line-height:1.45; color:var(--slate2);}
  .stat-note{margin:12px 0 0; font-size:12px; line-height:1.45; color:var(--slate2);}
  @media(max-width:900px){.stats{grid-template-columns:1fr 1fr;}}
  @media(max-width:600px){.stats{grid-template-columns:1fr;}.stat{width:100%;}}


  /* Option 2 - compact filter */
  .filterbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 10px;}
  .filter-left{display:flex;align-items:center;gap:8px;position:relative;}
  .filter-btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 13px;border:1px solid #d5dce7;
    border-radius:7px;background:#fff;color:var(--slate);font-size:13px;font-weight:600;}
  .filter-btn:hover{border-color:#b9c6d8;background:#f8fafc;}
  .filter-btn.active{color:var(--blue);border-color:#b9c9e3;background:#f5f9ff;}
  .filter-count{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
    background:var(--blue);color:#fff;font-size:11px;font-weight:700;}
  .filter-menu{position:absolute;left:0;top:46px;z-index:30;width:310px;padding:16px;background:#fff;
    border:1px solid #d9e0ea;border-radius:9px;box-shadow:0 12px 28px rgba(16,30,54,.15);}
  .filter-menu h3{margin:0 0 14px;font-size:14px;color:var(--navy);}
  .filter-field{margin-bottom:13px;}
  .filter-field:last-of-type{margin-bottom:16px;}

function getTeams(){
  const s = new Set(); ROWS.forEach(r=>r.teams.forEach(t=>s.add(t)));
  return ["All Teams", ...Array.from(s)];
}
function getRows(){
  let out = ROWS.filter(r=>{
    const okArchive = state.offLimitTab==="active" ? !r.archived : !!r.archived;
    const okRegion = state.region==="All" || state.region==="Global" ||
      r.regions.includes("Global") ||
      r.regions.includes(state.region) ||
      (state.region==="Europe" && r.regions.includes("EMEA")) ||
      (state.region==="EMEA" && (r.regions.includes("Europe") || r.regions.includes("Middle East"))) ||
      (state.region==="Asia" && r.regions.includes("APAC")) ||
      (state.region==="APAC" && r.regions.includes("Asia")) ||
      (state.region==="Americas" && (r.regions.includes("North America") || r.regions.includes("South America")));
    const okTeam = state.team==="All Teams" || r.teams.includes(state.team);
    const q = state.query.trim().toLowerCase();
    const okQuery = !q || r.client.toLowerCase().includes(q) || r.assignment.toLowerCase().includes(q)
      || r.scope.text.toLowerCase().includes(q) || r.scope.sub.toLowerCase().includes(q);
    return okArchive && okRegion && okTeam && okQuery;
  });
  const {key,dir} = state.sort;
  out = out.slice().sort((a,b)=>{
    let av,bv;
    if(key==="client"){av=a.client;bv=b.client;}
    else if(key==="assignment"){av=a.assignment;bv=b.assignment;}
    else if(key==="start"){av=a.start;bv=b.start;}
    else {av=a.updated;bv=b.updated;}
    const cmp = av<bv?-1:av>bv?1:0;
    return dir==="asc"?cmp:-cmp;
  });
  return out;
}

    : '<tr><td colspan="5"><div class="empty"><p>No proposals match your search.</p><button data-action="offProposalReset">Clear search</button></div></td></tr>';

  return '<section class="proposal-overview-section">'
    + '<div class="proposal-overview-head"><h2>Proposal Overview</h2>'
      + '<div class="proposal-overview-tools"><div class="proposal-overview-search"><input id="offProposalSearch" type="text" placeholder="Search" value="'+state.offProposalQuery.replace(/"/g,"&quot;")+'"></div>'
      + '<button class="proposal-overview-search-btn" data-action="offProposalSearch" title="Search">'+icon("search",18)+'</button>'
      + '<button class="proposal-overview-refresh" data-action="offProposalRefresh" title="Refresh">'+icon("refresh",17)+'</button></div>'
    + '</div>'
    + '<div class="proposal-overview-tabs">'
      + '<button class="proposal-overview-tab'+(state.proposalOverviewTab==="inprogress"?' active':'')+'" data-action="proposalOverviewTab:inprogress">In Progress</button>'
      + '<button class="proposal-overview-tab'+(state.proposalOverviewTab==="won"?' active':'')+'" data-action="proposalOverviewTab:won">Won</button>'
      + '<button class="proposal-overview-tab'+(state.proposalOverviewTab==="lost"?' active':'')+'" data-action="proposalOverviewTab:lost">Lost</button>'
    + '</div>'
    + '<div class="proposal-overview-table-wrap"><table class="proposal-overview-table"><thead><tr>'
      + '<th>Assignment #'+icon("chevronsUpDown",13)+'</th><th>Assignment Name'+icon("chevronsUpDown",13)+'</th><th>Client'+icon("chevronsUpDown",13)+'</th><th>Est. Revenue</th><th>Comments</th>'
    + '</tr></thead><tbody>'+rowHtml+'</tbody></table></div>'
    + '<div class="proposal-overview-foot"><span>Showing '+rows.length+' of '+OFFLIMIT_PROPOSAL_ROWS.filter(r=>r.status===state.proposalOverviewTab).length+' proposals</span><div class="pager"><button>'+icon("arrowLeft",14)+'</button><button class="cur">1</button><button>'+icon("arrowRight",14)+'</button></div></div>'
  + '</section>';
}

function registerView(){
  const tabs = REGION_TABS.map(r =>
    '<button class="rtab'+(state.region===r?" active":"")+'" data-action="region:'+r+'">'+r+'</button>'
  ).join("");

  const teamTabs = getTeams().map(t =>
    '<button class="team-tab'+(state.team===t?" active":"")+'" data-action="team:'+t+'">'+t+'</button>'
  ).join("");

  const stats = '<div class="stat">'
    + '<div class="stat-ic"><svg width="26" height="26" viewBox="0 0 26 26"><circle cx="7" cy="13" r="2.2" fill="currentColor"/><circle cx="13" cy="13" r="2.2" fill="currentColor"/><circle cx="19" cy="13" r="2.2" fill="currentColor"/></svg></div>'
    + '<div class="stat-copy"><div class="lbl">Global Pending Revenue '+icon("info",13)+'</div><div class="num">£8,500</div></div></div>'
    + '<div class="stat"><div class="stat-percent">19%</div><div class="stat-copy"><div class="lbl">% of Contracts with Restrictions '+icon("info",13)+'</div><div class="stat-note">This relates to the total number of contracts so far in the year.</div></div></div>'
    + '<div class="stat"><div class="stat-percent">38</div><div class="stat-copy"><div class="lbl">Number of Restrictions '+icon("info",13)+'</div><div class="stat-note">38 restrictions across 142 total contracts so far this year.</div></div></div>';

  const total = ROWS.length, shown = getRows().length;

  return topbar("Off-limits &amp; Non-Solicit Register")
    + '<main class="wrap-lg">'
      + '<div class="page-back-row"><button class="offlimits-back" data-action="nav:landing">'+icon("arrowLeft",14)+' Back to LegalDash</button></div>'
      + '<div class="offlimits-header"><div class="offlimits-title-wrap"><h1 class="reg-title">Off-limits and Non-Solicit Register</h1></div></div>'
      + '<div class="guidance">'+icon("shield",18)+'<p>This register lists clients and companies where Sheffield Haworth has agreed contractual restrictions on approaching, contacting, poaching or placing candidates. Before approaching any active candidate, check whether their current employer appears here. If in doubt, don\'t approach — please contact Legal before proceeding. A breach carries contractual and reputational risk for the firm.</p></div>'
      + '<div class="stats">'+stats+'</div>'
      + '<div class="reg">'
        + '<div class="record-tabs"><button class="record-tab'+(state.offLimitTab==="active"?' active':'')+'" data-action="offLimitTab:active">Active</button><button class="record-tab'+(state.offLimitTab==="archived"?' active':'')+'" data-action="offLimitTab:archived">Archived</button></div>'
        + '<div class="rtabs">'+tabs+'</div>'
        + '<div class="team-tabs">'+teamTabs+'</div>'
        + '<div class="controls"><div class="search">'+icon("search",18)+'<input id="search" type="text" placeholder="Search by client, candidate employer or assignment number" value="'+state.query.replace(/"/g,"&quot;")+'"></div>'
        + '<button class="icon-btn archive-action" data-action="archiveSelected" title="Archive selected" '+(state.offLimitTab==="active" && state.selectedOffLimits.length?'':'disabled')+'>'+icon("archive",17)+'</button>'
        + '<button class="icon-btn" data-action="reset" title="Reset filters">'+icon("refresh",17)+'</button></div>'
        + '<div class="tscroll"><table><thead>'+tableHead()+'</thead><tbody>'+tableBody()+'</tbody></table></div>'
        + '<div class="rfoot"><span>Showing '+shown+' of '+total+' restrictions</span><div class="pager"><button>'+icon("arrowLeft",14)+'</button><button class="cur">1</button><button>'+icon("arrowRight",14)+'</button></div></div>'
      + '</div>'
      + proposalOverviewSection()
    + '</main>'
    + (state.detailAssignment ? offLimitsDetailPanel(ROWS.find(x=>x.assignment===state.detailAssignment)) : '');
}

/* ---------------------------------------------------------------- */
/*  Render + events                                                 */
/* ---------------------------------------------------------------- */
const app = document.getElementById("app");

function reportsView(){
  const reports = [
    "Contract Overview Report",
    "Exclusivity Report",
    "Cross-Selling Report",
    "Monthly Wins - Assignments Report",
    "Quarterly Wins - Assignments Report",
    "Off-Limits View Breakdown Report"
  ];
  return topbar("Reports")
    + '<main class="wrap-lg reports-page">'
      + '<div class="page-back-row"><button class="offlimits-back" data-action="nav:landing">'+icon("arrowLeft",14)+' Back to LegalDash</button></div>'
      + '<div class="reports-title-card"><div class="agreement-title">Report Details</div></div>'
      + '<div class="reports-list-card">'
        + reports.map(r => '<div class="report-row"><div class="report-left"><div class="report-icon">'+icon("fileText",26)+'</div><span>'+r+'</span></div><button class="report-download">'+icon("arrowDown",15)+' Download</button></div>').join("")
      + '</div>'
    + '</main>';
}

function trustedView(){
  const users = [
    ["Mohit Kumar","Manage All"],["Sheree Okuromade","Manage All"],["Glen Magistrado","Manage All"],["Purva Shrivastava","Manage All"],["Sinead Stoppani","View All"],["Kelly Reyes","Manage All"],["Evelyn Wardell","Manage All"],["Emma Quan","View All"],["Lillian Ferragamo","View All"],["Frances Wright","Manage All"]
  ];
  return topbar("Trusted User")
    + '<main class="wrap-lg trusted-page">'
      + '<div class="page-back-row"><button class="offlimits-back" data-action="nav:landing">'+icon("arrowLeft",14)+' Back to LegalDash</button></div>'
      + '<div class="trusted-title-card"><div class="agreement-title">Trusted User</div><button class="add-template-btn">'+icon("plus",16)+' Add New Trusted User</button></div>'
      + '<div class="trusted-table-card"><div class="tscroll"><table class="trusted-table"><thead><tr><th>#</th><th>User Group Name'+icon("chevronsUpDown",13)+'</th><th>Permission Level</th><th>Action</th></tr></thead><tbody>'
      + users.map((u,i)=>'<tr><td><div class="user-mini">'+icon("user",16)+'</div></td><td>'+u[0]+'</td><td>'+u[1]+'</td><td><div class="trusted-actions"><button title="Edit">'+icon("pencil",15)+'</button><button title="Delete">'+icon("trash",15)+'</button></div></td></tr>').join("")
      + '</tbody></table></div><div class="trusted-pager"><span>‹</span><button class="active">1</button><span>2</span><span>3</span><span>4</span><span>5</span><span>›</span></div></div>'

function render(){
  let html;
  if(state.view==="landing") html = landingView();
  else if(state.view==="offlimits") html = registerView();
  else if(state.view==="proposals") html = proposalView();
  else if(state.view==="contracts") html = contractView();
  else if(state.view==="agreements") html = agreementView();
  else if(state.view==="changes") html = changeRequestView();
  else if(state.view==="reports") html = reportsView();
  else if(state.view==="trusted") html = trustedView();
  else html = stubView();
  app.innerHTML = html;
  if(state._focusSearch){
    const s = document.getElementById(state._focusSearchId || "search");
    if(s){ s.focus(); try{ s.setSelectionRange(state._caret,state._caret); }catch(e){} }
    state._focusSearch = false;
  }
}

document.addEventListener("click", function(e){
  if(state.profileOpen && !e.target.closest("[data-profile-panel]") && !e.target.closest(".avatar")){ state.profileOpen=false; }
  const offCheck = e.target.closest("[data-offlimit-check]");
  if(offCheck){
    const assignment = offCheck.getAttribute("data-offlimit-check");
    if(offCheck.checked){
      if(!state.selectedOffLimits.includes(assignment)) state.selectedOffLimits.push(assignment);
    }else{
      state.selectedOffLimits = state.selectedOffLimits.filter(x=>x!==assignment);
    }
    render();
    return;
  }
  const el = e.target.closest("[data-action]");
  // close scope popover on any click outside a scope cell
  if(!e.target.closest("[data-scopecell]")) state.openScope = null;

  if(!el){
    if(!e.target.closest("[data-dropdown]")){ state.teamOpen=false; state.colsOpen=false; }
    render(); return;
  }
  const action = el.getAttribute("data-action");
  const idx = action.indexOf(":");
  const name = idx===-1 ? action : action.slice(0,idx);
  const val  = idx===-1 ? null   : action.slice(idx+1);

  // default: collapse dropdowns unless the action manages them
  if(name!=="filterToggle") state.filterOpen=false;
  if(name!=="teamToggle" && name!=="colsToggle" && name!=="col") state.colsOpen=false;
  if(name!=="teamToggle" && name!=="colsToggle") state.teamOpen=false;

  switch(name){
    case "nav": state.view=val; state.detailAssignment=null; state.profileOpen=false; break;
    case "profileToggle": state.profileOpen=!state.profileOpen; break;
    case "offLimitTab": state.offLimitTab=val; state.selectedOffLimits=[]; break;
    case "proposalOverviewTab": state.proposalOverviewTab=val; break;
    case "offProposalSearch": break;
    case "offProposalRefresh": state.offProposalQuery=""; break;
    case "offProposalReset": state.offProposalQuery=""; break;
    case "selectAllOffLimits": {
      const rows = getRows();
      const allSelected = rows.length>0 && rows.every(r=>state.selectedOffLimits.includes(r.assignment));
      if(allSelected){
        state.selectedOffLimits = state.selectedOffLimits.filter(id=>!rows.some(r=>r.assignment===id));
      }else{
        rows.forEach(r=>{ if(!state.selectedOffLimits.includes(r.assignment)) state.selectedOffLimits.push(r.assignment); });
      }
      break;
    }
    case "archiveSelected":
      if(state.offLimitTab==="active" && state.selectedOffLimits.length){
        ROWS.forEach(r=>{ if(state.selectedOffLimits.includes(r.assignment)) r.archived=true; });
        state.selectedOffLimits=[];
      }
      break;
    case "region": state.region=val; state.filterOpen=false; break;
    case "filterToggle": state.filterOpen=!state.filterOpen; break;
    case "applyFilters":
      state.region = document.getElementById("regionFilter")?.value || "All";
      state.team = document.getElementById("teamFilter")?.value || "All Teams";
      state.filterOpen=false;
      break;
    case "clearFilters":
      state.region="Global"; state.team="All Teams"; state.filterOpen=false;
      break;
    case "teamToggle": state.teamOpen=!state.teamOpen; state.colsOpen=false; break;
    case "team": state.team=val; state.teamOpen=false; state.filterOpen=false; break;
    case "colsToggle": state.colsOpen=!state.colsOpen; state.teamOpen=false; break;
    case "col":
      if(val==="end") state.showEnd=!state.showEnd;
      else state.showOverview=!state.showOverview;
      break;
    case "sort":
      state.sort = state.sort.key===val
        ? {key:val, dir:state.sort.dir==="asc"?"desc":"asc"}
        : {key:val, dir:"asc"};
      break;
    case "scope": state.openScope = state.openScope===val ? null : val; break;
    case "detail": state.detailAssignment=val; break;
    case "closeDetail": state.detailAssignment=null; break;
    case "reset":
      state.region="Global"; state.team="All Teams"; state.query="";
      state.selectedOffLimits=[];
      state.offProposalQuery=""; state.proposalOverviewTab="inprogress";
      state.sort={key:"updated",dir:"desc"};
      state.teamOpen=false; state.colsOpen=false; state.filterOpen=false;
      break;
    case "proposalReset":
      state.proposalQuery="";
      break;
    case "contractReset":
      state.contractQuery="";
      break;
  }
  render();
});

document.addEventListener("input", function(e){
  if(e.target.id==="search"){
    state.query = e.target.value;
    state._focusSearchId = "search";
    state._focusSearch = true;
    state._caret = e.target.selectionStart;
    render();
  }
  if(e.target.id==="proposalSearch"){
    state.proposalQuery = e.target.value;
    state._focusSearchId = "proposalSearch";
    state._focusSearch = true;
    state._caret = e.target.selectionStart;
    render();
  }
  if(e.target.id==="offProposalSearch"){
    state.offProposalQuery = e.target.value;
    state._focusSearchId = "offProposalSearch";
    state._focusSearch = true;
    state._caret = e.target.selectionStart;
    render();
  }
  if(e.target.id==="contractSearch"){
    state.contractQuery = e.target.value;
    state._focusSearchId = "contractSearch";
    state._focusSearch = true;
    state._caret = e.target.selectionStart;
    render();
  }

  if(e.target.id==="agreementSearch"){ state.agreementQuery=e.target.value; render(); const a=document.getElementById("agreementSearch"); if(a){a.focus();a.setSelectionRange(a.value.length,a.value.length);} }
});

render();
</script>

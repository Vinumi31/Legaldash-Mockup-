<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LegalDash — Off-Limits &amp; Non-Solicit Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
  /* ---- LegalDash design tokens (from styles.scss / _variables.scss) ---- */
  :root{
    --blue:#0B5ED7; --blue2:#1853db; --ink:#001529; --muted:#666D80; --muted2:#878a99;
    --bg:#F9FDFF; --line:#f0f0f0; --border:#EFEFEF; --thead:#F3F3F3; --card:#ffffff;
    --green:#2dcb73; --amber:#f6b749; --danger:#ff6c6c;
    --card-shadow:0 5px 10px rgba(11,94,215,.19); --radius:2px;
  }
  *{box-sizing:border-box; font-family:'Poppins',sans-serif;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;}
  button{font-family:inherit; cursor:pointer;}
  .ico{display:inline-block; vertical-align:middle; flex:none;}
  .tabular{font-variant-numeric:tabular-nums;}
  .clamp2{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}

  /* ---- Top bar (mirrors topbar.component.html) ---- */
  .topbar{position:sticky; top:0; z-index:30; display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-bottom:1px solid var(--border); padding:10px 22px;}
  .tb-left{display:flex; align-items:center; gap:16px;}
  .hamb{display:flex; flex-direction:column; gap:4px; border:none; background:none; padding:6px;}
  .hamb span{display:block; width:20px; height:2px; background:#5b6270; border-radius:2px;}
  .sh-logo{display:flex; align-items:center; gap:9px;}
  .sh-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:2px;}
  .sh-grid span{height:7px; width:7px; border-radius:1px;}
  .sh-name{line-height:1.05;}
  .sh-name .a{font-size:15px; font-weight:700; letter-spacing:.5px; color:#2b2f52;}
  .sh-name .b{font-size:12px; font-weight:600; letter-spacing:2px; color:#5b9bd5;}
  .crumb{display:flex; align-items:center; gap:6px; padding-left:12px; font-size:13px; color:var(--muted2);}
  .crumb .home{color:var(--blue); font-weight:600; background:none; border:none; padding:0;}
  .crumb .home:hover{text-decoration:underline;}
  .crumb .cur{color:var(--ink);}
  .tb-right{display:flex; align-items:center; gap:14px;}
  .btn-fin{display:flex; align-items:center; gap:8px; background:var(--green); color:#fff; border:none;
    border-radius:var(--radius); padding:8px 15px; font-size:13.5px; font-weight:500;}
  .avatar{height:38px; width:38px; border-radius:50%; background:#eef3fb; display:grid; place-items:center; color:#8a93a5;}

  /* ---- Layout ---- */
  .wrap{max-width:1160px; margin:0 auto; padding:34px 22px;}
  .wrap-lg{max-width:1320px; margin:0 auto; padding:22px;}
  .card{background:var(--card); box-shadow:var(--card-shadow); border-radius:var(--radius); border:0;}

  /* ---- Landing ---- */
  h1.title{margin:2px 0 0; font-size:24px; font-weight:600; color:var(--ink);}
  .lead{margin-top:6px; max-width:620px; font-size:13px; color:var(--muted);}
  .kicker{font-size:12px; font-weight:600; color:var(--blue);}
  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-top:26px;}
  @media(max-width:900px){.tiles{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:620px){.tiles{grid-template-columns:1fr;}}
  .tile{background:#fff; box-shadow:var(--card-shadow); border-radius:var(--radius); border:0; border-left:3px solid transparent;
    padding:18px 18px 16px; text-align:left; display:flex; flex-direction:column; align-items:flex-start;
    transition:transform .14s ease, box-shadow .14s ease;}
  .tile:hover{transform:translateY(-2px); box-shadow:0 10px 22px rgba(11,94,215,.24);}
  .tile.primary{border-left-color:var(--blue);}
  .tile-ic{height:44px; width:44px; border-radius:var(--radius); display:grid; place-items:center;}
  .tile-head{display:flex; width:100%; align-items:flex-start; justify-content:space-between; gap:8px; margin-top:14px;}
  .tile-head h2{margin:0; font-size:16px; font-weight:600; color:var(--ink);}
  .tile-head .arr{color:#c2c8d2; margin-top:2px; transition:transform .14s ease;}
  .tile:hover .tile-head .arr{transform:translate(2px,-2px); color:var(--blue);}
  .tile p{margin:5px 0 0; font-size:12.5px; color:var(--muted); line-height:1.5;}
  .tile .meta{margin-top:14px; font-size:11px; font-weight:500; color:var(--muted2);
    background:#f4f7fc; border-radius:var(--radius); padding:3px 9px;}

  /* ---- Register: title + guidance ---- */
  .reg-title{margin:0; font-size:20px; font-weight:600; color:var(--ink);}
  .guidance{margin-top:11px; display:flex; align-items:flex-start; gap:11px; background:#fef8ea;
    border:1px solid #f6e2b0; border-left:3px solid var(--amber); border-radius:var(--radius); padding:11px 15px;}
  .guidance .ico{color:#c98a12; margin-top:1px;}
  .guidance p{margin:0; font-size:12.5px; line-height:1.6; color:#4a4436;}

  /* ---- Stat cards ---- */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin:18px 0;}
  @media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr);}}
  .stat{background:#fff; box-shadow:var(--card-shadow); border-radius:var(--radius); padding:15px 16px; border-left:3px solid var(--blue);}
  .stat .num{font-size:26px; font-weight:600; color:var(--ink); line-height:1.1;}
  .stat .lbl{margin-top:3px; font-size:11.5px; font-weight:400; color:var(--muted2);}

  /* ---- Register card ---- */
  .rtabs{display:flex; flex-wrap:wrap; gap:2px; border-bottom:1px solid #eef0f3; padding:10px 14px 0;}
  .rtab{border:none; background:none; border-bottom:2px solid transparent; padding:5px 14px 9px; font-size:13.5px;
    font-weight:500; color:var(--muted);}
  .rtab.active{color:var(--blue); border-bottom-color:var(--blue); font-weight:600;}

  .controls{display:flex; flex-direction:column; gap:11px; padding:15px;}
  @media(min-width:768px){.controls{flex-direction:row; align-items:center;}}
  .search{position:relative; flex:1;}
  .search .ico{position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted2); pointer-events:none;}
  .search input{height:42px; width:100%; border:1px solid var(--border); border-radius:.25rem; padding:0 12px 0 38px;
    font-size:13.5px; color:var(--ink); outline:none; box-shadow:0 1px 3px 0 rgba(0,0,0,.05),0 1px 1px 0 rgba(0,0,0,.025);}
  .search input:focus{border-color:var(--blue);}
  .dd{position:relative;}
  .dd-btn{display:flex; align-items:center; gap:8px; height:42px; border:1px solid var(--border); background:#fff;
    border-radius:var(--radius); padding:0 13px; font-size:13.5px; font-weight:400; color:#3a4150;}
  .dd-menu{position:absolute; right:0; z-index:20; margin-top:4px; background:#fff; border:1px solid #eef0f3;
    border-radius:var(--radius); box-shadow:0 6px 18px rgba(11,94,215,.16);}
  .dd-menu.team{width:220px; padding:4px 0;}
  .dd-menu.cols{width:210px; padding:6px;}
  .dd-item{display:flex; width:100%; align-items:center; justify-content:space-between; background:none; border:none;
    padding:8px 13px; text-align:left; font-size:13.5px; color:#3a4150;}
  .dd-item:hover{background:#f5f8fd;}
  .dd-item.on{color:var(--blue); font-weight:500;}
  .cols-h{padding:4px 8px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.4px; color:var(--muted2);}
  .chk{display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:var(--radius); font-size:13.5px; color:#3a4150; cursor:pointer;}
  .chk:hover{background:#f5f8fd;}
  .box{display:grid; place-items:center; height:16px; width:16px; border-radius:2px; border:1px solid #c7ccd6; background:#fff; color:#fff;}
  .box.on{background:var(--blue); border-color:var(--blue);}
  .icon-btn{display:grid; place-items:center; height:42px; width:42px; border:1px solid var(--border); background:#fff;
    border-radius:var(--radius); color:var(--muted2);}

  /* ---- Table (mirrors ant-table styling from styles.scss) ---- */
  .tscroll{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{background:var(--thead); color:var(--ink); font-weight:500; font-size:13px; text-align:left;
    padding:11px 15px; white-space:nowrap;}
  th .sortbtn{display:flex; align-items:center; gap:6px; background:none; border:none; padding:0; font:inherit; font-weight:500; color:var(--ink);}
  th .sortbtn .ico{color:#b7bcc6;}
  th .sortbtn.active .ico{color:var(--blue);}
  th .sortbtn.asc .ico{transform:rotate(180deg);}
  tbody td{border-bottom:1px solid var(--line); padding:13px 15px; vertical-align:top; font-size:13px; color:#2b313e;}
  td.client{font-weight:500; color:var(--ink);}
  td.assign span{color:var(--blue); font-weight:600;}
  td.date{color:#50565E; white-space:nowrap;}
  td.over{color:#50565E;}
  .pills{display:flex; flex-wrap:wrap; gap:5px;}
  .pill{display:inline-flex; align-items:center; border-radius:2px; padding:2px 8px; font-size:11px; font-weight:500;
    line-height:18px; white-space:nowrap; border:1px solid transparent;}
  td.scope{max-width:270px; color:#50565E;}
  td.scope p{margin:0; font-size:12.5px; line-height:1.4; color:#50565E;}
  .scope-btn{margin-top:2px; background:none; border:none; padding:0; font-size:11.5px; font-weight:600; color:var(--blue);}
  .scope-btn:hover{text-decoration:underline;}
  .scope-pop{position:absolute; left:0; top:100%; z-index:20; margin-top:4px; width:288px; background:#fff;
    border:1px solid #eef0f3; border-radius:var(--radius); box-shadow:0 8px 22px rgba(11,94,215,.18); padding:12px;}
  .scope-pop .sp-h{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .scope-pop .sp-h span{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.4px; color:var(--blue);}
  .scope-pop .sp-h button{background:none; border:none; color:var(--muted2); padding:0;}
  .scope-pop .row{font-size:12.5px;} .scope-pop .row + .row{margin-top:4px;}
  .scope-pop .k{font-weight:600; color:var(--ink);} .scope-pop .v{color:#50565E;}
  .scope-pop .note{margin:8px 0 0; padding-top:8px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted2);}
  .empty{padding:44px 15px; text-align:center;}
  .empty p{margin:0; font-size:13px; font-weight:500; color:var(--muted);}
  .empty button{margin-top:4px; background:none; border:none; font-size:13px; font-weight:600; color:var(--blue);}
  .empty button:hover{text-decoration:underline;}

  .rfoot{display:flex; align-items:center; justify-content:space-between; border-top:1px solid var(--line);
    padding:11px 15px; font-size:12px; color:var(--muted2);}
  .pager{display:flex; align-items:center; gap:5px;}
  .pager button{display:grid; place-items:center; height:28px; min-width:28px; padding:0 4px; border-radius:2px;
    border:1px solid #e2e6ec; background:#fff; color:#8a93a5;}
  .pager button.cur{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:500; font-size:12px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Icons (Lucide-style paths, stand in for Bootstrap Icons in the preview) */
const ICONS = {

  check:'<path d="M20 6 9 17l-5-5"/>',
  sort:'<path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/>',

  clipboard:'<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/>',
  signature:'<path d="M12 22h6a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v10"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10.4 12.6a2 2 0 1 1 3 3L8 21l-4 1 1-4Z"/>',
  bar:'<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
};
function icon(n,s){s=s||18;return '<svg class="ico" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+ICONS[n]+'</svg>';}

/* Tag palettes drawn from _variables.scss theme colors */
const TEAM_COLORS = {
  "SH Leadership":{bg:"#eaedf5",fg:"#405189",bd:"#d4dae8"},
  "Global Insurance":{bg:"#fde9f1",fg:"#c13d70",bd:"#f6cfe0"},
  "SH Consulting":{bg:"#e4f4f7",fg:"#2b8391",bd:"#c8e8ed"},
  "Executive Search":{bg:"#e3edfb",fg:"#0B5ED7",bd:"#c7dcf6"},
  "Interim":{bg:"#efeafe",fg:"#6b45d6",bd:"#ddd2fb"},
  "Legal":{bg:"#fdefe1",fg:"#b96a1a",bd:"#f6ddc2"},
};
const teamColor=t=>TEAM_COLORS[t]||{bg:"#f0f1f3",fg:"#50565E",bd:"#e2e4e8"};
const REGION_COLORS={
  "Global":{bg:"#eaedf5",fg:"#405189",bd:"#d4dae8"},
  "North America":{bg:"#e3edfb",fg:"#0B5ED7",bd:"#c7dcf6"},
  "Europe":{bg:"#e2f7ec",fg:"#1f9a56",bd:"#c6efd8"},
  "Asia":{bg:"#fdf4e0",fg:"#b5842a",bd:"#f6e7c2"},
  "EMEA":{bg:"#efeafe",fg:"#6b45d6",bd:"#ddd2fb"},
  "APAC":{bg:"#e4f4f7",fg:"#2b8391",bd:"#c8e8ed"},
};
const regionColor=r=>REGION_COLORS[r]||{bg:"#f0f1f3",fg:"#50565E",bd:"#e2e4e8"};
const REGION_TABS=["All","Global","North America","Europe","Asia","EMEA","APAC"];

const ROWS=[
  {client:"ABC Consultants",assignment:"SH0003560",teams:["SH Leadership","Global Insurance"],regions:["APAC"],
   scope:{sub:"Global Real Assets",text:"Real Estate Strategic Advisory — restriction applies to this sub-practice only, not the wider team."},
   start:"2026-08-20",updated:"2026-09-05",end:"2028-08-30",overview:"This is overview comment."},
  {client:"LSEG Technology",assignment:"SH0003068",teams:["SH Consulting"],regions:["Europe"],
   scope:{sub:"Trading & Risk Technology",text:"Restriction applies to all approaches within the specified business area."},
   start:"2026-08-14",updated:"2026-09-01",end:"2028-08-14",overview:"Restriction applies to all approaches within the specified business area."},
  {client:"Meridian Capital Partners",assignment:"SH0004120",teams:["Executive Search"],regions:["North America"],
   scope:{sub:"Private Equity",text:"Deal origination and portfolio operations team only; excludes fundraising and IR."},
   start:"2026-06-02",updated:"2026-08-22",end:"2028-06-02",overview:"Portfolio operations leadership off-limits for 24 months."},
  {client:"Nordström Advisory",assignment:"SH0004455",teams:["Interim","Legal"],regions:["Europe","EMEA"],
   scope:{sub:"Finance Transformation",text:"Interim CFO and finance transformation practice; permanent placements are unaffected."},
   start:"2026-05-18",updated:"2026-07-30",end:"2027-05-18",overview:"Interim engagements only."},
  {client:"Halcyon Life Sciences",assignment:"SH0004980",teams:["Executive Search"],regions:["North America","Europe"],
   scope:{sub:"Oncology Franchise",text:"R&D and clinical leadership across the oncology franchise; commercial roles excluded."},
   start:"2026-07-11",updated:"2026-09-06",end:"2029-07-11",overview:"Clinical leadership restriction, oncology only."},
  {client:"Orion Global Bank",assignment:"SH0005012",teams:["SH Leadership"],regions:["Global"],
   scope:{sub:"Group ExCo",text:"Group executive committee and direct reports — all regions, all functions."},
   start:"2026-03-09",updated:"2026-08-15",end:"2028-03-09",overview:"Firm-wide executive restriction."},
  {client:"Sakura Holdings",assignment:"SH0005190",teams:["SH Consulting"],regions:["Asia","APAC"],
   scope:{sub:"Consumer & Retail",text:"Consumer and retail advisory covering the Japan and Greater China desks."},
   start:"2026-04-27",updated:"2026-08-19",end:"2027-10-27",overview:"Regional consumer advisory restriction."},
  {client:"Atlas Infrastructure",assignment:"SH0005301",teams:["Executive Search","Legal"],regions:["EMEA"],
   scope:{sub:"Energy Transition",text:"Energy transition and renewables coverage team; conventional power excluded."},
   start:"2026-02-14",updated:"2026-07-02",end:"2028-02-14",overview:"Renewables coverage only."},
  {client:"Vantage Wealth Group",assignment:"SH0005478",teams:["Interim"],regions:["North America"],
   scope:{sub:"Wealth Operations",text:"Wealth management operations — client-facing advisor roles are restricted."},
   start:"2026-06-30",updated:"2026-09-03",end:"2028-06-30",overview:"Advisor roles restricted."},
];
const STATS=[
  {label:"Total Contracts YTD",value:"142"},
  {label:"Number of Restrictions",value:"38"},
  {label:"Contracts with Restrictions",value:"27"},
  {label:"% of Contracts with Restrictions",value:"19%"},
];
const TILES=[
  {key:"contracts",title:"Contract Register",desc:"Active, completed, pending and lost contracts across the firm.",icon:"fileText",meta:"142 contracts",accent:"#0B5ED7"},
  {key:"offlimits",title:"Off-Limits Register",desc:"Clients and companies with contractual restrictions on approaching candidates.",icon:"ban",meta:"38 restrictions",accent:"#0B5ED7",primary:true},
  {key:"proposals",title:"Proposals Register",desc:"Proposals in progress, won and lost, with estimated revenue.",icon:"clipboard",meta:"In progress · Won · Lost",accent:"#2dcb73"},
  {key:"agreements",title:"Agreement Template",desc:"Standard legal agreement templates for engagements.",icon:"signature",meta:"Templates",accent:"#8561f9"},
  {key:"reports",title:"Reports",desc:"Exportable compliance and register reporting.",icon:"bar",meta:"Reporting",accent:"#4ab0c1"},
  {key:"changes",title:"Change Request",desc:"Raise and track changes to register records.",icon:"pencil",meta:"Requests",accent:"#f1963b"},
];
const STUB={contracts:"Contract Register",proposals:"Proposals Register",agreements:"Agreement Template",reports:"Reports",changes:"Change Request"};

const state={view:"landing",region:"All",team:"All Teams",query:"",showEnd:false,showOverview:false,
  sort:{key:"updated",dir:"desc"},teamOpen:false,colsOpen:false,openScope:null,_focusSearch:false,_caret:0};

function getTeams(){const s=new Set();ROWS.forEach(r=>r.teams.forEach(t=>s.add(t)));return ["All Teams",...s];}
function getRows(){
  let out=ROWS.filter(r=>{
    const okR=state.region==="All"||r.regions.includes(state.region);
    const okT=state.team==="All Teams"||r.teams.includes(state.team);
    const q=state.query.trim().toLowerCase();
    const okQ=!q||r.client.toLowerCase().includes(q)||r.assignment.toLowerCase().includes(q)||r.scope.text.toLowerCase().includes(q)||r.scope.sub.toLowerCase().includes(q);
    return okR&&okT&&okQ;});
  const{key,dir}=state.sort;
  out=out.slice().sort((a,b)=>{let av,bv;
    if(key==="client"){av=a.client;bv=b.client;}else if(key==="assignment"){av=a.assignment;bv=b.assignment;}
    else if(key==="start"){av=a.start;bv=b.start;}else{av=a.updated;bv=b.updated;}
    const c=av<bv?-1:av>bv?1:0;return dir==="asc"?c:-c;});
  return out;
}

function topbar(crumb){
  return '<header class="topbar"><div class="tb-left">'
    +'<button class="hamb"><span></span><span></span><span></span></button>'
    +'<div class="sh-logo"><div class="sh-grid">'+Array.from({length:9}).map((_,i)=>'<span style="background:'+(i%2?"#5b9bd5":"#2b2f52")+'"></span>').join('')+'</div>'
    +'<div class="sh-name"><div class="a">SHEFFIELD</div><div class="b">HAWORTH</div></div></div>'
    +(crumb?'<nav class="crumb"><button class="home" data-action="nav:landing">LegalDash</button>'+icon("chevronRight",14)+'<span class="cur">'+crumb+'</span></nav>':'')
    +'</div><div class="tb-right">'
    +'<button class="btn-fin">Go to FinDash '+icon("arrowRight",15)+'</button>'
    +'<div class="avatar">'+icon("user",22)+'</div></div></header>';
}
function landingView(){
  const tiles=TILES.map(t=>'<button class="tile'+(t.primary?" primary":"")+'" data-action="nav:'+t.key+'">'
    +'<div class="tile-ic" style="background:'+t.accent+'18;color:'+t.accent+'">'+icon(t.icon,22)+'</div>'
    +'<div class="tile-head"><h2>'+t.title+'</h2><span class="arr">'+icon("arrowUpRight",18)+'</span></div>'
    +'<p>'+t.desc+'</p><span class="meta">'+t.meta+'</span></button>').join('');
  return topbar(null)+'<main class="wrap"><div class="kicker">Sheffield Haworth</div>'
    +'<h1 class="title">LegalDash</h1>'
    +'<p class="lead">Choose a register to open. Legal and compliance records are grouped here so you can go straight to what you need.</p>'
    +'<div class="tiles">'+tiles+'</div></main>';
}
function stubView(){const t=STUB[state.view]||"Register";
  return topbar(t)+'<main class="wrap"><div class="card" style="padding:56px 24px;text-align:center;max-width:640px;margin:0 auto">'
    +'<div style="margin:0 auto 16px;height:52px;width:52px;border-radius:2px;display:grid;place-items:center;background:#e3edfb;color:#0B5ED7">'+icon("fileText",24)+'</div>'
    +'<h1 class="reg-title" style="text-align:center">'+t+'</h1>'
    +'<p style="margin:8px auto 0;max-width:420px;font-size:13px;color:#666D80">This register keeps its existing location and functionality. It is outside the scope of this redesign, which focuses on the Off-Limits &amp; Non-Solicit Register.</p>'
    +'<button data-action="nav:landing" style="margin-top:22px;background:#0B5ED7;color:#fff;border:none;border-radius:2px;padding:9px 16px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px">'+icon("arrowLeft",15)+' Back to LegalDash</button>'
    +'</div></main>';
}
function sortHeader(l,k){const a=state.sort.key===k;const c="sortbtn"+(a?" active":"")+(a&&state.sort.dir==="asc"?" asc":"");
  return '<button class="'+c+'" data-action="sort:'+k+'">'+l+icon("sort",12)+'</button>';}
function tableHead(){let h='<tr><th>'+sortHeader("Client Name","client")+'</th><th>'+sortHeader("Assignment Number","assignment")+'</th>'
  +'<th>Team</th><th>Region</th><th>Scope</th><th>'+sortHeader("Start Date","start")+'</th><th>'+sortHeader("Last Updated","updated")+'</th>';
  if(state.showEnd)h+='<th>End Date</th>';if(state.showOverview)h+='<th>Overview</th>';return h+'</tr>';}
function tableBody(){
  const rows=getRows();const cc=7+(state.showEnd?1:0)+(state.showOverview?1:0);
  if(!rows.length)return '<tr><td colspan="'+cc+'"><div class="empty"><p>No restrictions match these filters.</p><button data-action="reset">Clear filters</button></div></td></tr>';
  return rows.map(r=>{
    const teams='<div class="pills">'+r.teams.map(t=>{const c=teamColor(t);return '<span class="pill" style="background:'+c.bg+';color:'+c.fg+';border-color:'+c.bd+'">'+t+'</span>';}).join('')+'</div>';
    const regions='<div class="pills">'+r.regions.map(rg=>{const c=regionColor(rg);return '<span class="pill" style="background:'+c.bg+';color:'+c.fg+';border-color:'+c.bd+'">'+rg+'</span>';}).join('')+'</div>';
    const open=state.openScope===r.assignment;
    const pop=open?'<div class="scope-pop"><div class="sp-h"><span>Restriction scope</span><button data-action="scope:'+r.assignment+'">'+icon("x",13)+'</button></div>'
      +'<div class="row"><span class="k">Team:</span> <span class="v">'+r.scope.sub+'</span></div>'
      +'<div class="row"><span class="k">Scope:</span> <span class="v">'+r.scope.text+'</span></div>'
      +'<p class="note">Applies to part of the team\'s remit, not the entire team.</p></div>':'';
    let td='<td class="client">'+r.client+'</td><td class="assign"><span>'+r.assignment+'</span></td>'
      +'<td>'+teams+'</td><td>'+regions+'</td>'
      +'<td class="scope" data-scopecell><div style="position:relative"><p class="clamp2">'+r.scope.text+'</p>'
      +'<button class="scope-btn" data-action="scope:'+r.assignment+'">'+(open?"Hide":"View scope")+'</button>'+pop+'</div></td>'
      +'<td class="date tabular">'+r.start+'</td><td class="date tabular">'+r.updated+'</td>';
    if(state.showEnd)td+='<td class="date tabular">'+r.end+'</td>';
    if(state.showOverview)td+='<td class="over">'+r.overview+'</td>';
    return '<tr>'+td+'</tr>';
  }).join('');
}
function registerView(){
  const teams=getTeams();
  const tabs=REGION_TABS.map(r=>'<button class="rtab'+(state.region===r?" active":"")+'" data-action="region:'+r+'">'+r+'</button>').join('');
  const teamMenu=state.teamOpen?'<div class="dd-menu team" data-dropdown>'+teams.map(t=>'<button class="dd-item'+(state.team===t?" on":"")+'" data-action="team:'+t+'">'+t+(state.team===t?icon("check",14):"")+'</button>').join('')+'</div>':'';
  const colsMenu=state.colsOpen?'<div class="dd-menu cols" data-dropdown><div class="cols-h">Optional columns</div>'
    +'<label class="chk" data-action="col:end"><span class="box'+(state.showEnd?" on":"")+'">'+(state.showEnd?icon("check",11):"")+'</span>End Date</label>'
    +'<label class="chk" data-action="col:overview"><span class="box'+(state.showOverview?" on":"")+'">'+(state.showOverview?icon("check",11):"")+'</span>Overview</label></div>':'';
  const stats=STATS.map(s=>'<div class="stat"><div class="num">'+s.value+'</div><div class="lbl">'+s.label+'</div></div>').join('');
  return topbar("Off-limits &amp; non-solicit register")+'<main class="wrap-lg">'
    +'<div><h1 class="reg-title">Off-limits and non-solicit register</h1>'
    +'<div class="guidance">'+icon("shield",17)+'<p>This register lists clients and companies where Sheffield Haworth has agreed contractual restrictions on approaching, contacting, poaching or placing candidates. Before approaching any active candidate, check whether their current employer appears here. If in doubt, don\'t approach — please contact Legal before proceeding. A breach carries contractual and reputational risk for the firm.</p></div></div>'
    +'<div class="stats">'+stats+'</div>'
    +'<div class="card"><div class="rtabs">'+tabs+'</div><div class="controls">'
    +'<div class="search">'+icon("search",17)+'<input id="search" type="search" placeholder="Search by client, assignment number or scope" value="'+state.query.replace(/"/g,"&quot;")+'"></div>'
    +'<div class="dd"><button class="dd-btn" data-action="teamToggle">'+state.team+' '+icon("chevronDown",15)+'</button>'+teamMenu+'</div>'
    +'<div class="dd"><button class="dd-btn" data-action="colsToggle">'+icon("eye",16)+' Columns</button>'+colsMenu+'</div>'
    +'<button class="icon-btn" data-action="reset" title="Reset filters">'+icon("refresh",16)+'</button></div>'
    +'<div class="tscroll"><table><thead>'+tableHead()+'</thead><tbody>'+tableBody()+'</tbody></table></div>'
    +'<div class="rfoot"><span>Showing '+getRows().length+' of '+ROWS.length+' restrictions</span>'
    +'<div class="pager"><button>'+icon("arrowLeft",14)+'</button><button class="cur">1</button><button>'+icon("arrowRight",14)+'</button></div></div></div></main>';
}
const app=document.getElementById("app");
function render(){
  app.innerHTML = state.view==="landing"?landingView():state.view==="offlimits"?registerView():stubView();
  if(state._focusSearch){const s=document.getElementById("search");if(s){s.focus();try{s.setSelectionRange(state._caret,state._caret);}catch(e){}}state._focusSearch=false;}
}
document.addEventListener("click",function(e){
  const el=e.target.closest("[data-action]");const action=el&&el.getAttribute("data-action");
  if(!e.target.closest("[data-scopecell]"))state.openScope=null;
  if(!action){if(!e.target.closest("[data-dropdown]")){state.teamOpen=false;state.colsOpen=false;}render();return;}
  const i=action.indexOf(":");const name=i===-1?action:action.slice(0,i);const val=i===-1?null:action.slice(i+1);
  if(name!=="teamToggle"&&name!=="colsToggle"&&name!=="col")state.colsOpen=false;
  if(name!=="teamToggle"&&name!=="colsToggle")state.teamOpen=false;
  switch(name){
    case"nav":state.view=val;state.openScope=null;break;
    case"region":state.region=val;break;
    case"teamToggle":state.teamOpen=!state.teamOpen;state.colsOpen=false;break;
    case"team":state.team=val;state.teamOpen=false;break;
    case"colsToggle":state.colsOpen=!state.colsOpen;state.teamOpen=false;break;
    case"col":if(val==="end")state.showEnd=!state.showEnd;else state.showOverview=!state.showOverview;break;
    case"sort":state.sort=state.sort.key===val?{key:val,dir:state.sort.dir==="asc"?"desc":"asc"}:{key:val,dir:"asc"};break;
    case"scope":state.openScope=state.openScope===val?null:val;break;
    case"reset":state.region="All";state.team="All Teams";state.query="";state.sort={key:"updated",dir:"desc"};break;
  }
  render();
});
document.addEventListener("input",function(e){
  if(e.target.id==="search"){state.query=e.target.value;state._focusSearch=true;state._caret=e.target.selectionStart;render();}
});
render();
</script>
</body>
</html>
